seed: 42
paths:
  output_dir: artifacts/classifier/dinov2
  checkpoint: artifacts/classifier/dinov2/best.pt
  gallery_dir: artifacts/classifier/gunduz-gallery
dataset:
  root: data/datasetDiatom
  table_path: data/splits/classifier/all.csv
  codec_table_path: data/splits/classifier/canonical_codec.csv
  id_column: id_crop
  genus_column: genus
  species_column: species
  split_column: split
  path_column: path
model:
  name: dinov2_vitb14_reg
  repository: facebookresearch/dinov2
  pretrained: true
  device: cuda
  unfreeze_layers: 0
projection_head: {hidden_dim: 512, projection_dim: 256, dropout: 0.1}
loss:
  temperature: 0.1
  genus_weight: 1.0
  species_weight: 1.5
  hierarchy_weight: 0.25
  species_margin: 0.20
  genus_margin: 0.10
sampler:
  class_sampling: power
  sampling_power: 0.5
  genera_per_batch: 4
  species_per_genus: 2
  samples_per_species: 2
  hard_negative_probability: 0.0
  auto_hard_negative_groups: false
loader: {num_workers: 4, pin_memory: true, eval_batch_size: 64}
transforms:
  color_mode: grayscale
  image_size: 224
  augmentation:
    views: 2
    crop_scale: [0.85, 1.0]
    crop_ratio: [0.9, 1.1]
    horizontal_flip: 0.5
    vertical_flip: 0.5
    rotation_degrees: 180
    brightness: 0.15
    contrast: 0.15
    saturation: 0.0
    hue: 0.0
    blur_probability: 0.12
training:
  epochs: 60
  learning_rate: 0.0003
  backbone_learning_rate: 0.00001
  weight_decay: 0.0001
  gradient_clip: 1.0
  mixed_precision: true
  validation_knn_k: 3
  monitor: val/f1_macro_species
  early_stopping: {enabled: true, patience: 8, min_delta: 0.002}
evaluation:
  validation_reference_split: train
  retrieval:
    primary: prototype_softmax_k3
    strategies:
      - {name: prototype_softmax_k3, method: prototype_softmax, k: 3, temperature: 0.03, prototype_weight: 0.4, neighbors_weight: 0.6}
diagnostics:
  enabled: true
  interval_epochs: 5
  recall_at_k: [1, 3, 5]
  max_embedding_points: 1000
  nearest_neighbor_queries: 25
  nearest_neighbors_k: 5
  seed: 42
clearml:
  enabled: false
  project_name: DiatomDINO
  task_name: train-dinov2-public-sources
  tags: [classifier, dinov2, public-data, closed-set]
  output_uri: null
