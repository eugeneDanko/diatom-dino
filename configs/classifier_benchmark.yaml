seed: 42
paths:
  output_dir: artifacts/classifier/gunduz-benchmark
  checkpoint: artifacts/classifier/dinov2/best.pt
  gallery_dir: artifacts/classifier/gunduz-gallery
dataset:
  root: data/datasetDiatom
  table_path: data/splits/benchmark/gunduz/all.csv
  codec_table_path: data/splits/benchmark/gunduz/canonical_codec.csv
  id_column: id_crop
  genus_column: genus
  species_column: species
  split_column: split
  path_column: path
model:
  name: dinov2_vitb14_reg
  repository: facebookresearch/dinov2
  pretrained: true
  device: cuda
  unfreeze_layers: 0
projection_head: {hidden_dim: 512, projection_dim: 256, dropout: 0.1}
loader: {num_workers: 4, pin_memory: true, eval_batch_size: 64}
transforms: {color_mode: grayscale, image_size: 224}
evaluation:
  gallery_split: gallery
  test_split: test
  k: 3
  allow_unseen_gallery_labels: true
clearml:
  enabled: false
  project_name: DiatomDINO
  task_name: gunduz-transfer-benchmark
  tags: [benchmark, gunduz, unseen-class-retrieval]
  output_uri: null
