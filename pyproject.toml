[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diatom-dino"
version = "0.1.0"
description = "Hierarchical diatom detection and retrieval pipeline based on YOLO and DINOv2"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "ultralytics>=8.3",
    "opencv-python>=4.8",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.8"]
clearml = ["clearml>=1.16"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
visualization = ["umap-learn>=0.5"]
parquet = ["pyarrow>=14"]
jupyter = ["jupyterlab>=4.2", "ipykernel>=6.29", "ipywidgets>=8.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "detector*", "classifier*", "inference*", "data_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = [
    "test_public_data_pipeline.py",
    "test_base_trainer.py",
    "test_batch_sampler.py",
    "test_calibration.py",
    "test_clearml_metric_grouping.py",
    "test_config_loader.py",
    "test_contrastive_loss.py",
    "test_decision_logic.py",
    "test_detector_recall_calibration.py",
    "test_diagnostics.py",
    "test_faiss_retriever.py",
    "test_metrics.py",
    "test_obb_utils.py",
    "test_report_generator.py",
    "test_transforms.py",
    "test_notebook_runtime.py",
]
addopts = "-q"
